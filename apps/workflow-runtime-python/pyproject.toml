[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-runtime-python"
version = "0.2.0"
description = "Production-grade LangGraph workflow runtime scaffold for Golden Boilerplate"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35.0",
  "jsonschema>=4.23.0",
  "langchain>=0.3.0",
  "langchain-community>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain-postgres>=0.0.12",
  "langgraph>=0.2.34",
  "langgraph-checkpoint-postgres>=2.0.0",
  "langgraph-checkpoint-redis>=0.0.5",
  "langsmith>=0.1.95",
  "milvus-lite>=2.4.0",
  "pgvector>=0.3.0",
  "psycopg[binary,pool]>=3.2.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "python-json-logger>=2.0.7",
  "redis[hiredis]>=5.0.8",
  "tenacity>=9.0.0",
  "typing-extensions>=4.12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "ruff>=0.6.0", "mypy>=1.11.0"]

[project.scripts]
workflow-runtime = "worker.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
